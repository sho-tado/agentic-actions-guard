name: Agentic Actions Guard
description: Audit GitHub Actions workflows for risky AI-agent automation patterns.
author: OSS Maintainer Safety Contributors

inputs:
  path:
    description: Repository root, workflow directory, or workflow file to scan.
    required: false
    default: "."
  format:
    description: "Output format: markdown, json, sarif, review, annotations, or summary."
    required: false
    default: "sarif"
  fail-on:
    description: Severity threshold that fails the workflow.
    required: false
    default: "high"
  output:
    description: Optional path to write the report.
    required: false
    default: "agentic-actions-guard.sarif"
  allowlist:
    description: Optional JSON allowlist policy path.
    required: false
    default: ""
  allowlist-max-expiry-days:
    description: Optional maximum allowed number of days before an allowlist entry expires.
    required: false
    default: ""
  allowlist-require-removal-condition:
    description: Require allowlist entries to document how the accepted risk will be removed.
    required: false
    default: "false"
  step-summary:
    description: Write a short Markdown summary to the GitHub Actions step summary.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install Agentic Actions Guard
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Scan workflows
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_ALLOWLIST: ${{ inputs.allowlist }}
        INPUT_ALLOWLIST_MAX_EXPIRY_DAYS: ${{ inputs.allowlist-max-expiry-days }}
        INPUT_ALLOWLIST_REQUIRE_REMOVAL_CONDITION: ${{ inputs.allowlist-require-removal-condition }}
        INPUT_STEP_SUMMARY: ${{ inputs.step-summary }}
      run: |
        set +e
        args=(scan "$INPUT_PATH" --format "$INPUT_FORMAT" --fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_ALLOWLIST" ]; then
          args+=(--allowlist "$INPUT_ALLOWLIST")
        fi
        if [ -n "$INPUT_ALLOWLIST_MAX_EXPIRY_DAYS" ]; then
          args+=(--allowlist-max-expiry-days "$INPUT_ALLOWLIST_MAX_EXPIRY_DAYS")
        fi
        if [ "$INPUT_ALLOWLIST_REQUIRE_REMOVAL_CONDITION" = "true" ]; then
          args+=(--allowlist-require-removal-condition)
        fi
        agentic-actions-guard "${args[@]}" > "$INPUT_OUTPUT"
        status=$?
        cat -- "$INPUT_OUTPUT"
        if [ "$INPUT_STEP_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          summary_args=(scan "$INPUT_PATH" --format summary --fail-on critical)
          if [ -n "$INPUT_ALLOWLIST" ]; then
            summary_args+=(--allowlist "$INPUT_ALLOWLIST")
          fi
          if [ -n "$INPUT_ALLOWLIST_MAX_EXPIRY_DAYS" ]; then
            summary_args+=(--allowlist-max-expiry-days "$INPUT_ALLOWLIST_MAX_EXPIRY_DAYS")
          fi
          if [ "$INPUT_ALLOWLIST_REQUIRE_REMOVAL_CONDITION" = "true" ]; then
            summary_args+=(--allowlist-require-removal-condition)
          fi
          agentic-actions-guard "${summary_args[@]}" >> "$GITHUB_STEP_SUMMARY" || true
        fi
        exit "$status"
